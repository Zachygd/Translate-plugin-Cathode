# Cathode Translate: speed/memory tuning for Ollama on NVIDIA/AMD GPUs.
# Installed to /etc/systemd/system/ollama.service.d/ by install.sh.
# Remove this file and run `sudo systemctl daemon-reload && sudo systemctl restart ollama`
# to undo.
[Service]
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
